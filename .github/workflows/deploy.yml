name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build pages
        run: npm run build

      - name: Verify build output
        run: |
          PAGES=$(ls [0-9][0-9]-*.html 2>/dev/null | wc -l)
          echo "Generated lesson pages: $PAGES"
          if [ "$PAGES" -eq 0 ]; then
            echo "ERROR: No lesson pages were generated. Aborting deploy."
            exit 1
          fi
          if [ ! -s lessons.json ]; then
            echo "ERROR: lessons.json is missing or empty. Aborting deploy."
            exit 1
          fi
          echo "Build verification passed: $PAGES page(s), lessons.json present."

      - name: Assemble site
        run: |
          mkdir -p /tmp/_site
          cp index.html /tmp/_site/
          cp lesson.css /tmp/_site/
          cp runtime.js /tmp/_site/
          cp lessons.json /tmp/_site/
          cp .nojekyll /tmp/_site/
          [ -f favicon.svg ] && cp favicon.svg /tmp/_site/ || true
          cp [0-9][0-9]-*.html /tmp/_site/
          cp -r gadgets /tmp/_site/gadgets
          [ -d imgs ] && cp -r imgs /tmp/_site/imgs || true

      - name: Verify assembled site
        run: |
          PAGES=$(ls /tmp/_site/[0-9][0-9]-*.html 2>/dev/null | wc -l)
          echo "Pages in _site: $PAGES"
          if [ "$PAGES" -eq 0 ]; then
            echo "ERROR: No pages found in _site after assembly. Aborting deploy."
            exit 1
          fi
          echo "Assembly verification passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        timeout-minutes: 10
